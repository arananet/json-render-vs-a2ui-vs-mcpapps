technical_notes: |
  One npm package, TypeScript, ESM. Vitest for the protocol suite, Playwright for
  the browser suite, Vite to build the three host pages.

  The orchestrator is protocol-agnostic and talks to adapters through a narrow
  port interface (createSurface / emit / handoff / dispatchUserAction / trace), so
  the same scenario script drives all three. Anything a protocol cannot express is
  recorded as an outcome rather than worked around in the adapter — the gaps are
  the deliverable.

