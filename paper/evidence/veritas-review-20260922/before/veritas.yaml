version: 1

profile: scientific-paper

artifact:
  paths:
    - manuscript.md
    - REPRODUCTION.md
    - evidence/s2.txt
    - evidence/environment.json
    - evidence/editorial-20260921/environment-worktree.txt
    - evidence/editorial-20260921/npm-test.txt
    - evidence/editorial-20260921/final-paper-checks.txt
    - evidence/editorial-20260921/typecheck.txt
    - evidence/editorial-20260921/openspec-check.txt
    - evidence/editorial-20260921/browser.txt
    - evidence/editorial-20260921/report-check.txt
    - evidence/editorial-20260921/reference-access.md
    - evidence/editorial-20260921/pdf-build.txt
    - evidence/editorial-20260921/pdf-build-manifest.json
    - evidence/editorial-20260921/bundle-check.txt
    - evidence/editorial-20260921/pdfinfo.txt
    - evidence/editorial-20260921/pdffonts.txt
    - ../.openspec/runs/reproducible-protocol-comparison-paper/verify-113265801779000.json
    - ../src/scenarios/s2-concurrent-composition.ts
    - ../src/adapters/json-render/adapter.ts
    - ../src/adapters/a2ui/adapter.ts
    - ../src/adapters/mcp-apps/adapter.ts
    - ../src/adapters/mcp-apps/host.ts
    - ../src/report/generate.ts
    - ../tests/protocol/scenarios.test.ts
    - ../tests/protocol/mcp-apps-bridge.test.ts
    - ../tests/browser/render.spec.ts

# Secrets never live here. Only environment variable names and model ids do.
# Copy .env.example from the Veritas repository and set the values there.
models:
  default:
    provider: ${VERITAS_DEFAULT_PROVIDER:-anthropic}
    model: ${VERITAS_DEFAULT_MODEL}
    tls_verify: ${VERITAS_TLS_VERIFY:-true}

  # A different vendor on purpose, so one model's blind spots do not decide the
  # outcome. Point it at the default provider if you only have one key.
  adversarial:
    provider: ${VERITAS_ADVERSARIAL_PROVIDER:-openai}
    model: ${VERITAS_ADVERSARIAL_MODEL}
    tls_verify: ${VERITAS_TLS_VERIFY:-true}

  # Consolidates the other judges' results. Optional: without it the meta
  # review still runs, deterministically, and only the narrative summary is lost.
  meta:
    provider: ${VERITAS_META_PROVIDER:-google}
    model: ${VERITAS_META_MODEL}
    tls_verify: ${VERITAS_TLS_VERIFY:-true}

gate:
  fail_on:
    - critical
  max_major: 0

# Nothing executes unless it is listed here.
execution:
  allow: []

workspace:
  mode: worktree          # Codex trabaja sobre una copia, no sobre tu árbol

loop:
  enabled: true
  max_iterations: 3

repair:
  mode: autopilot
  agent:
    provider: generic-cli
    command: [codex, exec, "{prompt_file}"]
    env_passthrough: [OPENAI_API_KEY]
  permissions:
    documentation: true     # reescribir el manuscrito
    source_code: true
    tests: true
    experiments: false      # ejecutar experimentos nuevos: NO
    datasets: false
    scientific_claims: false
    methodology: false
