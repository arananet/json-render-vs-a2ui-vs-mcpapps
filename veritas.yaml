version: 1

profile: scientific-paper

artifact:
  max_file_chars: 120000    # por fichero; el manuscrito entra entero, los lockfiles no
  # Frozen evidence: repair agents may never change these.
  frozen:
    - paper/evidence/**
  paths:
    - paper/manuscript.md
    - paper/REPRODUCTION.md
    - paper/EXECUTION.md
    - paper/evidence
    - paper/figures
    - src/adapters
    - src/report
    - src/orchestrator
    - src/scenarios
    - web/mcp-apps.ts
    - tests/protocol
    - tests/browser
    - package.json
    - docs/COMPARISON.md
    - package-lock.json

# Secrets never live here. Only environment variable names and model ids do.
# Copy .env.example from the Veritas repository and set the values there.
models:
  default:
    provider: ${VERITAS_DEFAULT_PROVIDER:-anthropic}
    model: ${VERITAS_DEFAULT_MODEL}
    tls_verify: ${VERITAS_TLS_VERIFY:-true}

  # A different vendor on purpose, so one model's blind spots do not decide the
  # outcome. Point it at the default provider if you only have one key.
  adversarial:
    provider: ${VERITAS_ADVERSARIAL_PROVIDER:-openai}
    model: ${VERITAS_ADVERSARIAL_MODEL}
    tls_verify: ${VERITAS_TLS_VERIFY:-true}

  # Consolidates the other judges' results. Optional: without it the meta
  # review still runs, deterministically, and only the narrative summary is lost.
  meta:
    provider: ${VERITAS_META_PROVIDER:-google}
    model: ${VERITAS_META_MODEL}
    tls_verify: ${VERITAS_TLS_VERIFY:-true}

checks:
  arxiv-package:
    target: paper/manuscript.tex
  citability:
    type: content-patterns
    enabled: true
    target: paper/manuscript.md
    severity_on_failure: minor
    required_patterns:
      - pattern: '10\.\d{4,}/'
        description: un DOI del trabajo archivado
      - pattern: '(?i)data availability|availability statement'
        description: una declaración de disponibilidad de datos
    forbidden_patterns:
      - pattern: '(?i)(github|gitlab)\.com/\S+/(blob|tree)/(main|master)/'
        description: un enlace a rama mutable en vez de a un commit fijado

pricing:
  currency: USD
  rates:
    claude-sonnet-5: {input_per_million: 3.0, output_per_million: 15.0}
    gpt-5.6-luna: {input_per_million: 1.25, output_per_million: 10.0}

gate:
  accepted_risks:
    - category: check/reference-integrity/unsupplied
      reason: "Lockfiles, PDFs and prior versions excluded to keep evaluation affordable."
    - category: reproducibility
      location: paper/manuscript.md
      reason: "Single-machine browser evidence; independent reproduction is declared as not performed."
      expires: 2026-12-31

thesis:
  - "Under the tested configurations and one fixed write order, reusing an identifier overwrites in the shared mappings and is retained in separate MCP instances."
  - "Model-only tool rejection depends on the installed host handler, not the SDK default."

metadata:
  title: "Shared UI State and Host Enforcement: An Empirical Technical Note on Three Agent-UI Configurations"
  repository: https://github.com/arananet/json-render-vs-a2ui-vs-mcpapps
  doi: 10.5281/zenodo.22896881

# Nothing executes unless it is listed here.
execution:
  allow: []

workspace:
  mode: snapshot          # Codex trabaja sobre una copia, no sobre tu árbol

loop:
  enabled: true
  max_iterations: 3

concurrency: 1

repair:
  mode: autopilot
  agent:
    provider: generic-cli
    command:
      - sh
      - -c
      - 'codex exec --approve-for-me -C {workspace} "$(cat {prompt_file})"'
    env_passthrough: [OPENAI_API_KEY]
    timeout: 1800
  permissions:
    documentation: true
    source_code: true
    tests: true
    experiments: false
    datasets: false
    scientific_claims: false
    methodology: false
